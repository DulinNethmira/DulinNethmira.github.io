<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | Page Not Found - Dulin Designs</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      background-color: var(--bg-primary);
      margin: 0;
      padding: 20px;
    }
    .error-content {
      max-width: 600px;
    }
    .error-code {
      font-family: var(--font-heading);
      font-size: clamp(6rem, 15vw, 10rem);
      font-weight: 800;
      margin: 0;
      background: linear-gradient(to right, var(--gradient-start), var(--gradient-end));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }
    .error-title {
      font-family: var(--font-heading);
      font-size: 2rem;
      margin: 20px 0;
    }
    .error-desc {
      color: var(--text-secondary);
      margin-bottom: 40px;
      font-size: 1.1rem;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      background: var(--accent);
      color: var(--bg-primary);
      border-radius: var(--radius-md);
      font-weight: 600;
      transition: var(--transition-medium);
    }
    .btn-home:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="error-content">
    <h1 class="error-code">404</h1>
    <h2 class="error-title">Whoops! You're lost in space.</h2>
    <p class="error-desc">The page you're looking for doesn't exist or has been moved. Let's get you back to the main site.</p>
    <a href="/" class="btn-home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Back to Portfolio
    </a>
  </div>

  <!-- Ambient Orbs -->
  <div class="ambient-bg">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
  </div>
</body>
</html>
